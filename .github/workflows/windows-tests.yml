# PAZ Suite is used on Windows, so its tests run on Windows - on every
# push and pull request, and on demand from the Actions tab.
#
# The Beat This model (PyTorch) is not installed: it is gigabytes, and
# the one test that needs it skips itself without it. Everything else,
# including the tests that need a real Tk window and the audio clock,
# runs for real here.
name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: python -m pip install customtkinter Pillow numpy sounddevice pytest "ruff==0.15.8"

      - name: Lint
        run: python -m ruff check paz_suite tests

      - name: Tests
        run: python -m pytest -q -rs tests
